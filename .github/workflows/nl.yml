name: Northern Lights

# Nightly: merge upstream's latest stable release, typecheck, push to main.
# The Contabo host deploys main on its own timer (nl/deploy.sh).
# Pull requests: the same checks.
on:
  schedule: [{ cron: "0 3 * * *" }]
  workflow_dispatch:
  pull_request:

permissions:
  contents: write
  issues: write
  actions: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v6
        with: { fetch-depth: 0 }

      - name: Merge latest upstream stable release
        id: merge
        if: github.event_name != 'pull_request'
        run: |
          if [ -n "$(gh issue list --label upstream-sync --state open --json number -q '.[]')" ]; then
            echo "An upstream-sync issue is open; close it once main is fixed."; exit 0
          fi
          tag=$(gh api repos/pingdotgg/t3code/releases/latest -q .tag_name)
          git fetch --no-tags https://github.com/pingdotgg/t3code.git "refs/tags/$tag:refs/tags/upstream/$tag"
          if git merge-base --is-ancestor "upstream/$tag" HEAD; then echo "Already on $tag"; exit 0; fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          conflicted=false
          if ! git merge --no-edit "upstream/$tag"; then
            conflicted=true
            files=$(git diff --name-only --diff-filter=U)
            # Only these carry hand-written changes; any other conflict is rebrand.sh output.
            hand=$(printf '%s\n' "$files" | grep -xF -e apps/server/src/server.ts \
              -e apps/server/src/relay/AgentAwarenessRelay.ts -e apps/mobile/app.config.ts || true)
            if [ -n "$hand" ]; then echo "Resolve by hand:"; echo "$hand"; exit 1; fi
            for f in $files; do git checkout --theirs -- "$f" 2>/dev/null || git rm -q -- "$f"; done
          fi
          sh nl/rebrand.sh
          git add -A
          if [ "$conflicted" = true ]; then git commit -q --no-edit
          elif ! git diff --cached --quiet; then git commit -q -m "chore(nl): rebrand upstream $tag"; fi

      - name: Setup Vite+
        if: github.event_name == 'pull_request' || steps.merge.outputs.tag != ''
        uses: ./.github/actions/setup-ci-deps

      - name: Typecheck and test
        if: github.event_name == 'pull_request' || steps.merge.outputs.tag != ''
        run: |
          vp run typecheck
          cd apps/server && vp test run src/northernlights

      - name: Push to main
        if: steps.merge.outputs.tag != ''
        run: git push origin HEAD:main

      - name: Report a failed sync
        if: failure() && steps.merge.outputs.tag != ''
        run: |
          gh issue create --label upstream-sync --title "Upstream ${{ steps.merge.outputs.tag }}: sync failed" \
            --body "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"

      # Upstream's workflows need their runners and secrets; new ones arrive enabled with each merge.
      - name: Keep upstream workflows disabled
        if: always() && github.event_name != 'pull_request'
        run: |
          gh workflow list --all --json path,state \
            -q '.[] | select(.state == "active" and .path != ".github/workflows/nl.yml") | .path' |
            while read -r path; do gh workflow disable "$(basename "$path")"; done
