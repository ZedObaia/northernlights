<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0B1236"/>
      <stop offset="0.6" stop-color="#070B22"/>
      <stop offset="1" stop-color="#03050F"/>
    </linearGradient>
    <radialGradient id="haze" cx="0.5" cy="0.62" r="0.55">
      <stop offset="0" stop-color="#1FD6A0" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#1FD6A0" stop-opacity="0"/>
    </radialGradient>
    <!-- Aurora curtains: bright green at the base, cyan, then violet fading into the sky. -->
    <linearGradient id="aurora" gradientUnits="userSpaceOnUse" x1="0" y1="780" x2="0" y2="190">
      <stop offset="0" stop-color="#4BFFB3"/>
      <stop offset="0.35" stop-color="#2EE6C8"/>
      <stop offset="0.65" stop-color="#38BDF8"/>
      <stop offset="0.88" stop-color="#A78BFA" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#A78BFA" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="38"/>
    </filter>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
  </defs>

  <rect width="1024" height="1024" fill="url(#sky)"/>
  <rect width="1024" height="1024" fill="url(#haze)"/>

  <g fill="#fff">
    <circle cx="168" cy="172" r="3.2" opacity="0.8"/>
    <circle cx="842" cy="138" r="2.6" opacity="0.7"/>
    <circle cx="610" cy="96" r="2" opacity="0.55"/>
    <circle cx="902" cy="372" r="2.2" opacity="0.5"/>
    <circle cx="96" cy="420" r="2" opacity="0.45"/>
    <circle cx="372" cy="128" r="1.8" opacity="0.5"/>
  </g>

  <!-- The N: two curtains joined by a diagonal ribbon. -->
  <g fill="none" stroke="url(#aurora)" stroke-linecap="round" stroke-linejoin="round">
    <path d="M312 790 V250 L712 790 V250" stroke-width="150" filter="url(#glow)" opacity="0.85"/>
    <path d="M312 790 V250 L712 790 V250" stroke-width="96" filter="url(#soft)"/>
    <path d="M312 790 V250 L712 790 V250" stroke-width="30" stroke="#E9FFF7" opacity="0.35" filter="url(#soft)"/>
  </g>

  <!-- Mountain ridge the lights rise behind. -->
  <path d="M0 818 L150 728 L238 772 L360 676 L470 760 L560 702 L668 784 L780 690 L884 756 L1024 700 V1024 H0 Z" fill="#050817"/>
  <path d="M0 880 L120 828 L262 866 L410 806 L548 862 L700 812 L842 860 L1024 820 V1024 H0 Z" fill="#02030A"/>
</svg>
